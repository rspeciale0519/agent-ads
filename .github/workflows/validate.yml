name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/prisma/build/index.js validate
      - run: node node_modules/prisma/build/index.js generate
      - run: pnpm run type-check
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run security:scan
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run security:rls-audit
      - run: pnpm run security:mutation-audit
      - run: pnpm run build

  guard-proof:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: agent_ads_f0
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_ads_f0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      F0_ALLOW_DISPOSABLE_DATABASE: "1"
      F0_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_ads_f0
      F0_DISPOSABLE_MARKER: f0000000-0000-4000-8000-000000000001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: psql --version
      - run: node scripts/f0/network-guard-proof.mjs

  schema-proof:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: agent_ads_f0
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_ads_f0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      F0_ALLOW_DISPOSABLE_DATABASE: "1"
      F0_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_ads_f0
      F0_DISPOSABLE_MARKER: f0000000-0000-4000-8000-000000000001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql --version
      - run: pnpm run security:f0-network
